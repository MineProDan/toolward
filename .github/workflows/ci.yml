# Lint, offline tests and the privacy scan. No secrets, no GPU, no Ollama: the agent tests use
# a mock model that replays recorded traces.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag after v7, so this pins a full release tag.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          python-version: "3.12"

      - name: Install dependencies (must match uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Tests (offline; includes privacy, mock-replay and README-sync tests)
        run: uv run pytest -q

      - name: Privacy scan of the working tree
        run: uv run python scripts/scan_for_secrets.py
