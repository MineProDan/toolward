[project]
name = "toolward"
version = "0.1.0"
description = "MCP server, local-model tool-calling agent, and code-graded eval suite for community-operations tools"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniel Betiu", email = "51977148+MineProDan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "ollama>=0.6.3",
    "pydantic>=2.14",
]

[project.scripts]
toolward-server = "toolward.server.__main__:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
