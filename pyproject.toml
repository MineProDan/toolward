[project]
name = "toolward"
version = "0.1.1"
description = "An MCP server of community-operations tools, a local-model tool-calling agent (Ollama), and a code-graded eval suite for tool use"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Betiu", email = "51977148+MineProDan@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "llm", "agents", "tool-calling", "evals", "ollama", "discord"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3,<3",
    "ollama>=0.6.3",
    "pydantic>=2.14",
]

[project.urls]
Homepage = "https://github.com/MineProDan/toolward"
Repository = "https://github.com/MineProDan/toolward"
Issues = "https://github.com/MineProDan/toolward/issues"

[project.scripts]
toolward-server = "toolward.server.__main__:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
